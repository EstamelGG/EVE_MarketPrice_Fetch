name: Fetch Market Prices

on:
  schedule:
    # 每小时的第50分钟执行
    - cron: '50 * * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  fetch-and-release:
    runs-on: ubuntu-latest
    
    # 授予必要权限，确保 gh 命令行工具可以操作 Release
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run fetch script
      id: fetch
      run: |
        # 运行脚本并捕获退出码
        python fetch_market_prices.py
        script_exit=$?
        echo "exit_code=$script_exit" >> $GITHUB_OUTPUT
        exit $script_exit
      continue-on-error: true

    - name: Fail on real API fault
      if: steps.fetch.outputs.exit_code == '1'
      run: |
        echo "数据接口失败且 ESI 状态正常，判定为真实故障"
        exit 1

    - name: Skip release when maintenance
      if: steps.fetch.outputs.exit_code == '2'
      run: |
        echo "ESI 维护中或不可用，跳过本次发布"

    - name: Atomic Release Update
      if: steps.fetch.outputs.exit_code == '0'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        RELEASE_TAG="market-prices"
        RELEASE_TITLE="Market Prices - $(date +'%Y-%m-%d %H:%M:%S')"
        FILE_PATH="./output/market_prices.json"

        echo "正在同步 Release 状态..."

        # 1. 检查是否存在同名的 Release（包括 Draft）并强制删除
        # 这可以清理掉之前因为网络抖动残留的“僵尸”Draft
        existing_release=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "not_found")
        
        if [ "$existing_release" != "not_found" ]; then
          echo "发现旧的 Release/Draft，正在清理..."
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag
        fi

        # 2. 创建全新的正式 Release
        # --draft=false 确保它不会停留在草稿状态
        # --notes 可以直接写在命令行，也可以指向文件
        gh release create "$RELEASE_TAG" "$FILE_PATH" \
          --title "$RELEASE_TITLE" \
          --notes "EVE Online 市场价格自动更新。数据生成时间: $(date -u +'%Y-%m-%d %H:%M:%S') UTC" \
          --draft=false \
          --prerelease=false

        echo "Release 更新成功: $RELEASE_TAG"
